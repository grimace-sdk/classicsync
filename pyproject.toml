[project]
name = "classicsync"
version = "0.1.2"
description = "Desktop connectivity and sync for Windows CE 1.x, 2.x and 3.x devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
gui = ["wxPython>=4.2"]
usb = ["pyusb>=1.2", "libusb-package>=1.0.26"]
artwork = ["pefile>=2023"]
keyring = ["keyring>=24"]
windows = ["pywin32>=306; sys_platform == 'win32'", "keyring>=24"]
macos = ["pyobjc-framework-Contacts>=10; sys_platform == 'darwin'", "pyobjc-framework-EventKit>=10; sys_platform == 'darwin'", "keyring>=24"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
classicsync = "classicsync.cli:main"
classicsync-gui = "classicsync.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classicsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs a live device or emulator (CLASSICSYNC_DEVICE)"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tools/gui_capture/*.py" = ["E402"]
"tests/*.py" = ["F811"]
"src/classicsync/*/__init__.py" = ["F401"]
