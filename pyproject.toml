[project]
name = "classicsync"
version = "0.1.0"
description = "Desktop connectivity and sync for Windows CE 1.x, 2.x and 3.x devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["wxPython>=4.2"]
usb = ["pyusb>=1.2"]
artwork = ["pefile>=2023"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
classicsync = "classicsync.cli:main"
classicsync-gui = "classicsync.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classicsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs a live device or emulator (CLASSICSYNC_DEVICE)"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tools/gui_capture/*.py" = ["E402"]
"tests/*.py" = ["F811"]
"src/classicsync/*/__init__.py" = ["F401"]
